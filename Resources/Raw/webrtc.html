<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HealthPets Video Call</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #1a1a2e;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .video-container {
            position: relative;
            width: 100%;
            height: 100%;
        }

        #remoteVideo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            background-color: #16213e;
        }

        #localVideo {
            position: absolute;
            bottom: 100px;
            right: 16px;
            width: 120px;
            height: 160px;
            object-fit: cover;
            border-radius: 12px;
            border: 2px solid #6B4EE6;
            background-color: #0f3460;
            z-index: 10;
        }

        .status-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 5;
        }

        .status-overlay.hidden {
            display: none;
        }

        .status-text {
            font-size: 18px;
            margin-top: 16px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(107, 78, 230, 0.3);
            border-top-color: #6B4EE6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .remote-video-off {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            display: none;
        }

        .remote-video-off.visible {
            display: block;
        }

        .avatar-placeholder {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #6B4EE6, #8B6EFF);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        .avatar-placeholder span {
            font-size: 48px;
            color: white;
        }

        .recording-indicator {
            position: absolute;
            top: 16px;
            left: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 0, 0, 0.8);
            padding: 8px 16px;
            border-radius: 20px;
            color: white;
            font-size: 14px;
            z-index: 20;
        }

        .recording-indicator.hidden {
            display: none;
        }

        .recording-dot {
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <video id="remoteVideo" autoplay playsinline></video>
        <video id="localVideo" autoplay playsinline muted></video>

        <div id="statusOverlay" class="status-overlay">
            <div class="spinner"></div>
            <div id="statusText" class="status-text">Conectando...</div>
        </div>

        <div id="remoteVideoOff" class="remote-video-off">
            <div class="avatar-placeholder">
                <span id="remoteInitial">?</span>
            </div>
            <div>Video desactivado</div>
        </div>

        <div id="recordingIndicator" class="recording-indicator hidden">
            <div class="recording-dot"></div>
            <span>Grabando</span>
        </div>
    </div>

    <script src="webrtc.js"></script>
</body>
</html>
